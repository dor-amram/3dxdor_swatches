<style>
/* Customer-facing colour library: filters on top, swatch grid, tap opens a 3D preview in two lights. */
:root{

  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --band-bg:#E3AFC0; --band:#E3AFC0; --band-ink:#2E1822; --band-muted:#5C3646; --brand-hi:#9B2F52;
  --accent:#8ED9C1; --accent-ink:#0D1A16; --accent-soft:#1F3A33; --peach:#F6BC93; --peach-ink:#2B1708;
  --in:#7FDCA0; --limited:#F6B07D; --order:#C9B3F5; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15141C; --surface:#1E1D28; --sunk:#111017; --ink:#EDEAF6; --muted:#A7A2BE; --line:#302E40;
  --band-bg:#E3AFC0; --band:#E3AFC0; --band-ink:#2E1822; --band-muted:#5C3646; --brand-hi:#9B2F52;
  --accent:#8ED9C1; --accent-ink:#0D1A16; --accent-soft:#1F3A33; --peach:#F6BC93; --peach-ink:#2B1708;
  --in:#7FDCA0; --limited:#F6B07D; --order:#C9B3F5; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}

button,input{font:inherit;color:inherit}
.wrap{max-width:1320px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.top{background:var(--band-bg);color:var(--band-ink);padding-top:env(safe-area-inset-top,0px)}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px 6px}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.5em;letter-spacing:.01em;line-height:1.15;min-width:0}
.brand span{white-space:nowrap}
.brand b{color:var(--brand-hi)} .brand span{font-weight:600;opacity:.8}
.tbtns{display:flex;gap:6px;flex:none}
.tb{border:1px solid color-mix(in srgb,var(--band-ink) 28%,transparent);background:color-mix(in srgb,var(--band-ink) 9%,transparent);border-radius:999px;padding:4px 11px;font-size:.8em;font-weight:600;cursor:pointer;color:var(--band-ink)}
.lede{color:var(--band-muted);max-width:760px;margin:0;padding-bottom:16px}
.controls{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-block:10px}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:16px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-top:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.88em;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dot{width:26px;height:26px;padding:0;border-radius:50%;flex:none;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.dot[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.count{color:var(--muted);font-size:.85em;padding-top:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;padding-block:16px 120px}
@media (min-width:900px){.grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}}
.card{position:relative;display:flex;flex-direction:column;gap:6px;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px 8px 10px;cursor:pointer;min-width:0}
.card:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.card:focus-visible,.chip:focus-visible,.dot:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sw{aspect-ratio:1;border-radius:11px;background:var(--c,#999);position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.sw::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 28% 18%,rgba(255,255,255,.28),transparent 55%)}
.fx-matte::after{background:none}
.fx-silk::after,.fx-silkmulti::after{background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.55) 45%,transparent 60%),linear-gradient(115deg,transparent 62%,rgba(255,255,255,.25) 70%,transparent 78%)}
.fx-clear{background:repeating-conic-gradient(#ccc 0 25%,#fff 0 50%) 0 0/18px 18px}
.fx-clear::before{content:"";position:absolute;inset:0;background:var(--c);opacity:.62}
.fx-cf::before,.fx-gf::before{content:"";position:absolute;inset:0;opacity:.35;background:repeating-linear-gradient(8deg,rgba(255,255,255,.35) 0 1px,transparent 1px 5px),repeating-linear-gradient(-14deg,rgba(255,255,255,.2) 0 1px,transparent 1px 7px)}
.fx-cf::after,.fx-gf::after{background:none}
.fx-wood::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 2px,transparent 2px 9px,rgba(0,0,0,.08) 9px 11px,transparent 11px 16px)}
.fx-marble::before{content:"";position:absolute;inset:0;background:radial-gradient(40% 12% at 30% 40%,rgba(255,255,255,.5),transparent),radial-gradient(30% 8% at 70% 70%,rgba(0,0,0,.35),transparent),radial-gradient(50% 6% at 50% 20%,rgba(0,0,0,.25),transparent)}
.fx-sparkle::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.95) 0 1px,transparent 1.5px),radial-gradient(circle,rgba(255,255,255,.7) 0 1px,transparent 1.5px);background-size:13px 11px,19px 17px;background-position:0 0,7px 5px}
.fx-metal::after{background:conic-gradient(from 200deg at 60% 40%,rgba(255,255,255,.5),transparent 25%,rgba(0,0,0,.25) 50%,transparent 75%,rgba(255,255,255,.5))}
.fx-resin::after{background:radial-gradient(70% 50% at 30% 20%,rgba(255,255,255,.45),transparent 60%)}
.nm{font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.mt{font-size:.82em;color:var(--muted)}
.av{display:inline-flex;align-items:center;gap:5px;font-size:.78em;font-weight:600}
.av::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.av-in{color:var(--in)} .av-limited{color:var(--limited)} .av-order{color:var(--order)}
.picked{position:absolute;top:14px;inset-inline-end:14px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.empty{padding:50px 10px;text-align:center;color:var(--muted)}
/* detail */
.sheet{position:fixed;inset:0;z-index:30;background:rgba(18,16,30,.45);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--surface);width:min(1100px,100%);max-height:96vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:900px){.sheet{align-items:center}.panel{border-radius:20px;max-height:92vh}}
.phead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.phead h2{margin:0;font-family:var(--f-display);font-size:1.6em;line-height:1.1}
.x{border:0;background:var(--sunk);border-radius:50%;width:38px;height:38px;font-size:20px;cursor:pointer;flex:none}
.views{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
@media (max-width:599px){.views{grid-template-columns:1fr}}
.view{position:relative;border-radius:14px;overflow:hidden;background:var(--sunk);aspect-ratio:4/3.4}
.view canvas{width:100%;height:100%;display:block;touch-action:none}
.vlabel{position:absolute;top:8px;inset-inline-start:8px;background:rgba(255,255,255,.82);color:#222;border-radius:999px;padding:2px 10px;font-size:.8em;font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.facts{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;color:var(--muted);font-size:.92em}
.facts b{color:var(--ink);font-weight:600}
.note{color:var(--muted);font-size:.85em;margin-top:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 15px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.fallback{display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);padding:20px;text-align:center}
/* picks bar */
.picks{position:fixed;inset-inline:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 18px rgba(40,30,80,.08)}
.picks .wrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pickrow{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto}
.pk{width:24px;height:24px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;z-index:40;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:.9em}
[hidden]{display:none!important}
[dir="rtl"] body{font-family:"Heebo",var(--f-body)}
</style>

  $('c-type').innerHTML=chip('type','',l.all,!S.type)+Object.keys(l.types).map(function(k){ return chip('type',k,l.types[k],S.type===k); }).join('')+chip('instock','1',l.instock,S.instock);
  $('c-fin').innerHTML=chip('fin','',l.all,!S.fin)+Object.keys(l.fins).map(function(k){ return chip('fin',k,l.fins[k],S.fin===k); }).join('');
  $('c-fam').innerHTML=Object.keys(FAMHEX).map(function(k){ return '<button class="dot" data-g="fam" data-v="'+k+'" title="'+esc(l.fams[k])+'" aria-label="'+esc(l.fams[k])+'" aria-pressed="'+(S.fam===k)+'" style="background:'+FAMHEX[k]+'"></button>'; }).join(''); }
function filtered(){ var q=S.q.trim().toLowerCase(); return S.items.filter(function(it){
  if(S.type&&typeGroup(it.type)!==S.type) return false; if(S.fin&&finGroup(it.e)!==S.fin) return false; if(S.fam&&it.fam!==S.fam) return false; if(S.instock&&it.avail==='order') return false;
  if(q){ var h=[it.name,it.name_he,it.type,it.type_he,it.fin,it.fin_he].join(' ').toLowerCase(); if(!q.split(/\s+/).every(function(w){ return h.indexOf(w)>=0; })) return false; } return true; }); }
function render(){ var l=L(), list=filtered();

  $('grid').innerHTML=list.length?list.map(function(it){ var p=S.picks.indexOf(it.k)>=0;
    return '<button class="card" data-k="'+it.k+'"><div class="sw fx-'+it.e+'" style="'+swStyle(it)+'"></div>'+(p?'<span class="picked">✓</span>':'')+
      '<div class="nm">'+esc(nm(it))+'</div><div class="mt">'+mtHtml(it)+'</div><span class="av av-'+it.avail+'">'+l[it.avail]+'</span></button>'; }).join(''):'<div class="empty">'+l.none+'</div>'; }
function renderPicks(){ var l=L(), ps=S.picks.map(function(k){ return S.items.filter(function(i){return i.k===k;})[0]; }).filter(Boolean);
  $('picks').hidden=!ps.length; $('pickn').textContent=ps.length+' '+l.picks;
  $('pickrow').innerHTML=ps.map(function(it){ return '<span class="pk" title="'+esc(nm(it))+'" style="'+swStyle(it).replace('--c:','background:')+'"></span>'; }).join(''); }
function pickText(){ var l=L(); return l.listHead+'\n'+S.picks.map(function(k){ var it=S.items.filter(function(i){return i.k===k;})[0]; return it?'• '+nm(it)+(S.lang==='he'&&it.name_he&&it.name_he!==it.name?' / '+it.name:'')+' ('+mt(it)+')':''; }).filter(Boolean).join('\n'); }
function toast(m){ var t=$('toast'); t.textContent=m; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(function(){ t.hidden=true; },2200); }
function savePicks(){ store('sw.picks',JSON.stringify(S.picks)); renderPicks(); render(); }
function fillDetail(){ var it=S.open, l=L(), p=S.picks.indexOf(it.k)>=0;
  $('d-name').textContent=nm(it); $('d-mat').innerHTML=mtHtml(it);
  $('dfacts').innerHTML='<span>'+l.mat+': <b>'+esc(l.types[typeGroup(it.type)]||it.type)+'</b></span>'+(finGroup(it.e)?'<span>'+l.fin+': <b>'+esc(l.fins[finGroup(it.e)])+'</b></span>':'')+
    '<span>'+l.av+': <b class="av-'+it.avail+'">'+l[it.avail]+'</b></span><span>'+l.hex+': <b>'+esc((it.hexes||[it.hex]).join(' / '))+'</b> · '+(it.maker?l.maker:l.approx)+'</span>';
  var extra=it.e==='cf'||it.e==='gf'?l.noteCF:it.e==='clear'?l.noteClear:it.e==='shift'?l.noteShift:it.e==='wood'?l.noteWood:it.g==='resin'?l.noteRes:'';
  $('dnote').textContent=(extra?extra+' ':'')+l.noteA; $('dpick').textContent=p?l.added:l.add;
  $('fuzzy').setAttribute('aria-pressed',S.fuzzy); $('shape').setAttribute('aria-pressed',S.ribbed); $('fuzzy').hidden=it.g==='resin'; }
function openDetail(k){ S.open=S.items.filter(function(i){return i.k===k;})[0]; if(!S.open) return; fillDetail(); $('sheet').hidden=false; document.body.style.overflow='hidden';
  if(window.Preview) window.Preview.show(S.open,S.fuzzy,S.ribbed); else if(!window.__3dfail) setTimeout(function(){ if(window.Preview&&S.open) window.Preview.show(S.open,S.fuzzy,S.ribbed); },800); }
function closeDetail(){ $('sheet').hidden=true; S.open=null; document.body.style.overflow=''; if(window.Preview) window.Preview.stop(); }
document.addEventListener('click',function(e){
  var c=e.target.closest('.card'); if(c){ openDetail(c.dataset.k); return; }
  var b=e.target.closest('[data-g]'); if(b){ var g=b.dataset.g, v=b.dataset.v; if(g==='instock') S.instock=!S.instock; else S[g]=S[g]===v?'':v; renderChips(); render(); return; }
  if(e.target.id==='sheet'||e.target.id==='dclose'){ closeDetail(); return; }

  if(e.target.id==='shape'){ S.ribbed=!S.ribbed; fillDetail(); if(window.Preview) window.Preview.show(S.open,S.fuzzy,S.ribbed); return; }

  if(e.target.id==='themebtn'){ S.theme=S.theme==='dark'?'light':'dark'; store('sw.theme',S.theme); applyTheme(); return; }
  if(e.target.id==='pclear'){ S.picks=[]; savePicks(); return; }
  if(e.target.id==='pcopy'){ var t=pickText(); (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){ toast(L().copied); },function(){ window.prompt('',t); }); return; }
  if(e.target.id==='pshare'){ var tx=pickText(); if(navigator.share) navigator.share({text:tx}).catch(function(){}); else window.open('https://wa.me/?text='+encodeURIComponent(tx),'_blank','noopener'); return; }
});
document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&S.open) closeDetail(); });
$('q').addEventListener('input',function(){ S.q=this.value; render(); });
applyTheme();
fetch('swatches.json').then(function(r){ return r.json(); }).then(function(d){
  S.items=d.items.map(function(it){ it.fam=family(it); return it; });
  var rank={in:0,limited:1,order:2}; S.items.sort(function(a,b){ return typeGroup(a.type).localeCompare(typeGroup(b.type))||a.fam.localeCompare(b.fam)||a.name.localeCompare(b.name); });
  S.picks=S.picks.filter(function(k){ return S.items.some(function(i){ return i.k===k; }); }); applyLang();
}).catch(function(){ $('grid').innerHTML='<div class="empty">Could not load the colour list.</div>'; applyLang(); });

<script type="module">
/* ---------- 3D preview: one renderer per canvas, procedural surface maps per effect ---------- */
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
try{
const cv=[document.getElementById('cv0'),document.getElementById('cv1')];
const R=cv.map(c=>{ const r=new THREE.WebGLRenderer({canvas:c,antialias:true,alpha:false}); r.setPixelRatio(Math.min(2,devicePixelRatio)); r.toneMapping=THREE.NeutralToneMapping; r.toneMappingExposure=1; return r; });
const pm=new THREE.PMREMGenerator(R[0]); const envTex=pm.fromScene(new RoomEnvironment(),0.04).texture;
const pm1=new THREE.PMREMGenerator(R[1]); const envTex1=pm1.fromScene(new RoomEnvironment(),0.04).texture;
function makeScene(i){ const s=new THREE.Scene();
  if(i===0){ s.background=new THREE.Color('#dfe6ee'); s.environment=envTex; s.environmentIntensity=0.85;
    const sun=new THREE.DirectionalLight(0xf3f6ff,2.4); sun.position.set(-3,4,3); s.add(sun); s.add(new THREE.HemisphereLight(0xdfe9ff,0xb9b2a6,0.6)); }
  else { s.background=new THREE.Color('#3a312b'); s.environment=envTex1; s.environmentIntensity=0.22;
    const lamp=new THREE.PointLight(0xffb46b,26,0,2); lamp.position.set(2.2,2.6,2.4); s.add(lamp);
    const fill=new THREE.DirectionalLight(0xffc98f,0.5); fill.position.set(-3,1,-1); s.add(fill); s.add(new THREE.AmbientLight(0xffd7a8,0.18)); }
  return s; }
const scenes=[makeScene(0),makeScene(1)];
const cam=new THREE.PerspectiveCamera(32,1,0.1,50); cam.position.set(0,1.05,5.0); cam.lookAt(0,0.95,0);
const group=[new THREE.Group(),new THREE.Group()]; scenes.forEach((s,i)=>s.add(group[i]));
// ground discs for contact
scenes.forEach((s,i)=>{ const g=new THREE.Mesh(new THREE.CircleGeometry(2.4,64),new THREE.MeshStandardMaterial({color:i?0x3b3430:0xeef1f5,roughness:1})); g.rotation.x=-Math.PI/2; s.add(g); });
function profile(ribbed){ const pts=[]; const N=90; for(let i=0;i<=N;i++){ const t=i/N, y=t*2.0;
  let r=0.42+0.26*Math.sin(Math.PI*(t*0.95+0.05))-0.12*t+0.05*Math.sin(t*9);
  pts.push(new THREE.Vector2(Math.max(0.05,r),y)); } pts.unshift(new THREE.Vector2(0.001,0)); return pts; }
const geoCache={};
function geometry(ribbed){ if(geoCache[ribbed]) return geoCache[ribbed]; let g=new THREE.LatheGeometry(profile(ribbed),180);
  if(ribbed){ const p=g.attributes.position, n=new THREE.Vector3(); for(let i=0;i<p.count;i++){ n.set(p.getX(i),0,p.getZ(i)); const r=n.length(); if(r<0.06) continue; const a=Math.atan2(p.getZ(i),p.getX(i)); const k=1+0.045*Math.cos(a*18); p.setX(i,p.getX(i)*k); p.setZ(i,p.getZ(i)*k); } g.computeVertexNormals(); }

// ---- procedural maps

function vnoise(w,h,cell,rand){ const gw=Math.max(1,Math.round(w/cell)), gh=Math.max(1,Math.round(h/cell)), cx=w/gw, cy=h/gh, g=new Float32Array(gw*gh).map(()=>rand()); const out=new Float32Array(w*h);
  const G=(i,j)=>g[(j%gh)*gw+(i%gw)];
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){ const fx=x/cx, fy=y/cy, ix=Math.floor(fx), iy=Math.floor(fy), tx=fx-ix, ty=fy-iy, sx=tx*tx*(3-2*tx), sy=ty*ty*(3-2*ty);
    const a=G(ix,iy),b=G(ix+1,iy),c=G(ix,iy+1),d=G(ix+1,iy+1); out[y*w+x]=a+(b-a)*sx+(c-a)*sy+(a-b-c+d)*sx*sy; } return out; }
function canvasTex(w,h,draw,srgb){ const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d'); draw(x,w,h); const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; if(srgb) t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; return t; }
function heightToNormal(H,w,h,str){ return canvasTex(w,h,(x)=>{ const im=x.createImageData(w,h); for(let y=0;y<h;y++) for(let i=0;i<w;i++){ const l=H[y*w+(i-1+w)%w], r=H[y*w+(i+1)%w], u=H[((y-1+h)%h)*w+i], d=H[((y+1)%h)*w+i];
  let nx=(l-r)*str, ny=(u-d)*str, nz=1, k=1/Math.hypot(nx,ny,nz); const o=(y*w+i)*4; im.data[o]=(nx*k*0.5+0.5)*255; im.data[o+1]=(ny*k*0.5+0.5)*255; im.data[o+2]=(nz*k*0.5+0.5)*255; im.data[o+3]=255; } x.putImageData(im,0,0); },false); }
function fibres(W,Hh,count,rand,lenMin,lenMax,cb,wrap){ for(let n=0;n<count;n++){ const x0=rand()*W, y0=rand()*Hh, a=(rand()-0.5)*0.9, L=lenMin+rand()*(lenMax-lenMin), dx=Math.cos(a)*L, dy=Math.sin(a)*L, r=rand();
  if(!wrap){ cb(x0,y0,dx,dy,r); continue; } for(const ox of [-W,0,W]) for(const oy of [-Hh,0,Hh]){ const xa=x0+ox, ya=y0+oy; if(Math.max(xa,xa+dx)<-2||Math.min(xa,xa+dx)>W+2||Math.max(ya,ya+dy)<-2||Math.min(ya,ya+dy)>Hh+2) continue; cb(xa,ya,dx,dy,r); } } }
const mapCache={};
function surfaceMaps(e,hexes,fuzzy,resin){ const key=e+'|'+hexes.join(',')+'|'+fuzzy+'|'+resin; if(mapCache[key]) return mapCache[key];
  const W=512,Hh=512, rand=rng(7+e.length*13+hexes.join('').length), H=new Float32Array(W*Hh); const LAYERS=resin?0:22;
  for(let y=0;y<Hh;y++){ const s=LAYERS?Math.pow(Math.abs(Math.sin(Math.PI*y*LAYERS/Hh)),0.6):0; for(let x=0;x<W;x++) H[y*W+x]=s*0.55; }
  if(fuzzy){ const n=vnoise(W,Hh,3,rand), n2=vnoise(W,Hh,9,rand); for(let i=0;i<H.length;i++) H[i]+=(n[i]*0.9+n2[i]*0.6); }
  const out={repeat:[6,LAYERS?Math.round(260/LAYERS):1]};
  let rough=null, metal=null, color=null; const base=hexes[0];
  if(e==='cf'||e==='gf'){ const tint=e==='cf'?'rgba(150,150,155,0.55)':'rgba(240,240,235,0.6)';
    color=canvasTex(W,Hh,(x)=>{ x.fillStyle=base; x.fillRect(0,0,W,Hh); x.strokeStyle=tint; x.lineWidth=1; fibres(W,Hh,e==='cf'?2600:1500,rng(11),6,22,(x0,y0,dx,dy)=>{ x.beginPath(); x.moveTo(x0,y0); x.lineTo(x0+dx,y0+dy); x.stroke(); },true); },true);
    rough=canvasTex(W,Hh,(x)=>{ x.fillStyle='rgb(0,235,0)'; x.fillRect(0,0,W,Hh); x.strokeStyle='rgb(0,110,0)'; x.lineWidth=1.2; fibres(W,Hh,e==='cf'?2600:1500,rng(11),6,22,(x0,y0,dx,dy)=>{ x.beginPath(); x.moveTo(x0,y0); x.lineTo(x0+dx,y0+dy); x.stroke(); },true); },false);
    fibres(W,Hh,1800,rng(11),6,22,(x0,y0,dx,dy)=>{ const st=Math.ceil(Math.hypot(dx,dy)); for(let s=0;s<st;s++){ const px=Math.floor(x0+dx*s/st+W)%W, py=Math.floor(y0+dy*s/st+Hh)%Hh; H[py*W+px]+=0.5; } }); }
  else if(e==='wood'){ const n=vnoise(W,Hh,24,rand), n2=vnoise(W,Hh,6,rand);
    color=canvasTex(W,Hh,(x)=>{ const im=x.createImageData(W,Hh), c=new THREE.Color(base); for(let y=0;y<Hh;y++){ const band=0.93+0.07*Math.sin(y*0.05+n[y*W]*6); for(let i=0;i<W;i++){ const g=1-0.16*Math.pow(Math.abs(Math.sin((y+n2[y*W+i]*14)*0.9)),18)-0.05*n2[y*W+i]; const k=band*g, o=(y*W+i)*4;
      im.data[o]=Math.min(255,c.r*255*k); im.data[o+1]=Math.min(255,c.g*255*k); im.data[o+2]=Math.min(255,c.b*255*k); im.data[o+3]=255; } } x.putImageData(im,0,0); },true); }
  else if(e==='marble'){ const n=vnoise(W,Hh,48,rand), n2=vnoise(W,Hh,14,rand);
    color=canvasTex(W,Hh,(x)=>{ const im=x.createImageData(W,Hh), c=new THREE.Color(base), dark=c.clone().multiplyScalar(0.45), lite=c.clone().lerp(new THREE.Color(1,1,1),0.55); for(let i=0;i<W*Hh;i++){ const v=Math.abs(Math.sin((n[i]*3+n2[i]*1.5+(i%W)/W*2)*Math.PI*2)); const vein=Math.pow(1-v,10), sp=Math.pow(1-Math.abs(Math.sin((n2[i]*5)*Math.PI)),30);
      const col=c.clone().lerp(dark,vein*0.8).lerp(lite,sp*0.6); im.data[i*4]=col.r*255; im.data[i*4+1]=col.g*255; im.data[i*4+2]=col.b*255; im.data[i*4+3]=255; } x.putImageData(im,0,0); },true); }
  else if(e==='sparkle'){ const flakes=[]; for(let i=0;i<2200;i++){ const fx=rand()*(W-3), fy=rand()*(Hh-3); flakes.push([fx,fy,0.6+rand()*1.4]); }
    color=canvasTex(W,Hh,(x)=>{ x.fillStyle=base; x.fillRect(0,0,W,Hh); x.fillStyle='rgba(235,235,240,0.9)'; flakes.forEach(f=>{ x.fillRect(f[0],f[1],f[2],f[2]); }); },true);
    metal=canvasTex(W,Hh,(x)=>{ x.fillStyle='#000'; x.fillRect(0,0,W,Hh); x.fillStyle='#fff'; flakes.forEach(f=>{ x.fillRect(f[0],f[1],f[2],f[2]); }); },false); }
  else if(hexes.length>1){ const grad=e==='gradient';
    color=canvasTex(W,Hh,(x)=>{ if(grad){ const g=x.createLinearGradient(0,0,0,Hh); const hs=hexes.concat([hexes[0]]); hs.forEach((h,i)=>g.addColorStop(i/(hs.length-1),h)); x.fillStyle=g; x.fillRect(0,0,W,Hh); } else { const k=hexes.length; hexes.forEach((h,i)=>{ x.fillStyle=h; x.fillRect(Math.floor(i*W/k),0,Math.ceil(W/k),Hh); }); } },true);
    out.colorRepeat=grad?[1,1]:[1,1]; }
  out.normal=heightToNormal(H,W,Hh,resin?0.6:(fuzzy?7:5)); out.color=color; out.rough=rough; out.metal=metal; mapCache[key]=out; return out; }
function material(it,fuzzy){ const e=it.e, hexes=(it.hexes&&it.hexes.length?it.hexes:[it.hex||'#999999']), resin=it.g==='resin';
  const m=new THREE.MeshPhysicalMaterial({color:new THREE.Color(hexes[0]),side:THREE.DoubleSide}); const maps=surfaceMaps(e,hexes,fuzzy,resin);
  const rep=(t,r)=>{ if(t){ t.repeat.set(r[0],r[1]); } };
  m.normalMap=maps.normal; rep(maps.normal,maps.repeat); m.normalScale.set(1,1);
  if(maps.color){ m.map=maps.color; m.color.set(0xffffff); rep(maps.color,maps.colorRepeat||[e==='cf'||e==='gf'||e==='sparkle'?maps.repeat[0]:2,e==='cf'||e==='gf'||e==='sparkle'?maps.repeat[1]:1]); }
  if(maps.rough){ m.roughnessMap=maps.rough; rep(maps.rough,maps.repeat); } if(maps.metal){ m.metalnessMap=maps.metal; rep(maps.metal,maps.repeat); }

    clear:{roughness:.28,transmission:.88,thickness:.6,ior:1.5},cf:{roughness:1},gf:{roughness:.88},wood:{roughness:.85},marble:{roughness:.62},sparkle:{roughness:.32,metalness:1},metal:{roughness:.36,metalness:.6},
    shift:{roughness:.3,iridescence:1,iridescenceIOR:1.8,clearcoat:.3,sheen:.4},gradient:{roughness:.5},dual:{roughness:.4,clearcoat:.2},resin:{roughness:.28,clearcoat:.45}}[e]||{roughness:.5};

  if(P.sheen){ m.sheenColor=new THREE.Color(hexes[0]).lerp(new THREE.Color(1,1,1),.5); m.sheenRoughness=.35; }
  if(P.iridescence){ m.iridescenceThicknessRange=[250,700]; }
  if(e==='clear'||(resin&&/clear|transparent|translucent|crystal/i.test(it.name))){ const c=new THREE.Color(hexes[0]); m.transmission=.88; m.thickness=.6; m.attenuationColor=c; m.attenuationDistance=.35; m.color=c.clone().lerp(new THREE.Color(1,1,1),.55); m.roughness=resin?.12:.3; }
  if(fuzzy&&!resin){ m.roughness=Math.min(1,m.roughness+.18); m.clearcoat=0; m.anisotropy=0; }
  return m; }
let meshes=[null,null], raf=0, angle=0.6, drag=null, autoSpin=true;
function size(){ cv.forEach((c,i)=>{ const w=c.clientWidth, h=c.clientHeight; if(!w||!h) return; R[i].setSize(w,h,false); }); const c=cv[0]; cam.aspect=(c.clientWidth||4)/(c.clientHeight||3); cam.updateProjectionMatrix(); }
function frame(){ raf=requestAnimationFrame(frame); if(autoSpin&&!drag) angle+=0.004; meshes.forEach(m=>{ if(m) m.rotation.y=angle; }); R.forEach((r,i)=>r.render(scenes[i],cam)); }
cv.forEach(c=>{ c.addEventListener('pointerdown',e=>{ drag={x:e.clientX,a:angle}; c.setPointerCapture(e.pointerId); autoSpin=false; });
  c.addEventListener('pointermove',e=>{ if(drag){ angle=drag.a+(e.clientX-drag.x)*0.012; } }); c.addEventListener('pointerup',()=>{ drag=null; }); });
addEventListener('resize',()=>{ if(raf) size(); });
window.Preview={ show(it,fuzzy,ribbed){ const g=geometry(!!ribbed), m=material(it,!!fuzzy);
    group.forEach((gr,i)=>{ if(meshes[i]){ gr.remove(meshes[i]); } meshes[i]=new THREE.Mesh(g,m); gr.add(meshes[i]); });
    requestAnimationFrame(()=>{ size(); if(!raf) frame(); }); },
  stop(){ cancelAnimationFrame(raf); raf=0; autoSpin=true; } };
if(window.S&&S.open) window.Preview.show(S.open,S.fuzzy,S.ribbed);
}catch(err){ window.__3dfail=true; document.getElementById('views').innerHTML='<div class="view"><div class="fallback">3D preview isn\'t available on this device.</div></div>'; }
